name: Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/telegram-test.trigger'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TK }}
          TG_CHAT: ${{ secrets.OBSIDIAN_GROUP }}
        run: |
          resp=$(curl -s -X POST -F "chat_id=$TG_CHAT" -F "text=Prova di collegamento: Oxydian Theme" "https://api.telegram.org/bot$TG_TOKEN/sendMessage")
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if d.get('ok') else 'ERRORE: ' + str(d.get('description')))"
